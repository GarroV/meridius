# Стенд открытого демо (D194) на VPS: /srv/meridius-demo, проект compose `meridius-demo`.
#
# Оверлей поверх deploy/compose.yaml, вторым файлом. Окружение — свой deploy/demo/.env, его
# передаёт `--env-file`: рядом с compose.yaml лежит боевой deploy/.env, и демо не должно
# подхватить его молча:
#   docker compose -p meridius-demo --env-file deploy/demo/.env \
#     -f deploy/compose.yaml -f deploy/demo/compose.demo.yaml ...
# Обычно не руками, а через deploy/demo/update.sh и deploy/demo/reset.sh.
#
# Отличия от прода:
# * своя база и свой том (`meridius-demo_pgdata`): с продом общая только внешняя сеть
#   edge-meridius к Caddy;
# * `DEMO_MODE=1`: вход `/demo` без пароля, плашка «Демо», закрыты управление учётками и
#   вход через Google. Реквизиты Google обнулены нарочно — демо к Google не ходит никогда;
# * наружу не публикуется ни один порт: до приложения Caddy доходит по сети edge-meridius
#   по алиасу `meridius-demo-app` (канон площадки — GarroV/vps-infra);
# * `seed` — одноразовый сервис: контур Demoland и учётки ролей. Его зовёт reset.sh раз в час.
name: meridius-demo

services:
  app:
    environment:
      DEMO_MODE: "1"
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      GOOGLE_REDIRECT_URI: ""
      GOOGLE_FRONT_REDIRECT_URI: ""
    networks:
      default:
      edge-meridius:
        aliases: [meridius-demo-app]

  # Стадия `build` держит исходники и все зависимости: сид — это скрипт на TypeScript из
  # src/, образу приложения (`runner`) они не нужны и в него не едут. Аргументы сборки те же,
  # что у `app`, чтобы слой `next build` взялся из кэша, а не собирался второй раз.
  seed:
    build:
      context: ..
      target: build
      args:
        BASE_PATH: ${BASE_PATH:-}
        PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?задайте PUBLIC_BASE_URL в deploy/demo/.env}
        BUILD_COMMIT: ${BUILD_COMMIT:-}
    profiles: ["seed"]
    restart: "no"
    command: ["node", "scripts/seed-demo.mjs"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      DEMO_MODE: "1"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

networks:
  edge-meridius:
    external: true
