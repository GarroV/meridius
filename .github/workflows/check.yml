# Единственный автоматический сторож проекта помимо хука pre-push на машине автора.
# Зовёт ту же команду, что приёмка блока и хук, — `scripts/check`: три отдельных
# списка команд разъезжаются, один не разъезжается (docs/furca/plan.md,
# «Проверки качества»).
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Карантин свежих версий (.npmrc, min-release-age) обходится любой установкой
      # не из лок-файла, поэтому здесь строго `npm ci`.
      - name: Зависимости
        run: npm ci

      - name: Браузер для сквозных сценариев
        run: npx --no-install playwright install --with-deps chromium

      # `scripts/up` здесь не зовётся, хотя подъём одной командой — критерий
      # готовности продукта: скрипт заканчивается `exec next start` и держит сервер
      # в foreground, то есть в неинтерактивном прогоне управление не возвращает
      # никогда (проверено — прогон висел до отмены). Пока у него нет режима
      # подготовки без запуска (задача T194), шаги повторены здесь явно.
      # Секрет подписи сессии берётся свой: на значении из `.env.example` продукт
      # намеренно отказывает во входе (src/blocks/auth/config.ts), потому что файл
      # лежит в git. Сервер для сквозных сценариев поднимает сам playwright.
      - name: Окружение стенда
        run: |
          cp .env.example .env
          sed -i "s|^SESSION_SECRET=.*|SESSION_SECRET=ci-only-$(openssl rand -hex 24)|" .env

      - name: База
        run: |
          docker compose -p meridius up -d db
          for _ in $(seq 1 60); do
            state=$(docker inspect -f '{{.State.Health.Status}}' meridius-db-1 2>/dev/null || echo starting)
            [ "$state" = "healthy" ] && break
            sleep 1
          done
          [ "$state" = "healthy" ] || { docker compose -p meridius logs db; exit 1; }

      - name: Миграции и демонстрационный контур
        run: |
          npm run --silent db:migrate
          node scripts/seed-demo.mjs

      - name: Весь набор проверок
        run: ./scripts/check

      # Машинный отчёт нужен именно у красного прогона: приёмка читает состав
      # прогона, а не код возврата.
      - name: Отчёты прогона
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: reports/
          retention-days: 14
          if-no-files-found: warn
